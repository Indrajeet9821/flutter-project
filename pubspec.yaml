name: ccms
description: "College Complaint Management System - A Flutter application for managing college complaints."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Firebase (will be configured later)
  # firebase_core: ^3.6.0
  # firebase_auth: ^5.3.1
  # cloud_firestore: ^5.4.4
  # firebase_storage: ^12.3.2
  # firebase_messaging: ^15.1.3

  # Image Picker
  image_picker: ^1.1.2

  # Date Formatting
  intl: ^0.20.1

  # Google Fonts
  google_fonts: ^6.2.1

  # UUID for generating unique IDs
  uuid: ^4.5.1

  # Cached Network Image
  cached_network_image: ^3.4.1

  # Charts (for admin reports)
  fl_chart: ^0.69.2

  # Shimmer loading effect
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
